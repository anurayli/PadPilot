name: macOS

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: xcodebuild -version && swift --version

      - name: Build app and dmg
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"; VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          bash mac/build.sh "$VERSION"

      - name: Smoke test (launch + screenshot)
        run: |
          open mac/dist/PadPilot.app
          sleep 8
          pgrep -x PadPilot
          screencapture -x mac/dist/screenshot.png || true
          pkill -x PadPilot || true

      - uses: actions/upload-artifact@v4
        with:
          name: PadPilot-mac
          path: |
            mac/dist/*.dmg
            mac/dist/screenshot.png

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" mac/dist/*.dmg --clobber
